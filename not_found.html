<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // VAMPII.OS</title>
    <link rel="stylesheet" href="fonts/dotgothic16.css">
    <style>
      :root { --p: #ff0099; --s: #ff66b3; --glow: rgba(255, 0, 153, 0.5); --text: #ffe6f2; --bg: #12000a; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 20px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 38%, color-mix(in srgb, var(--p) 22%, transparent), transparent 55%), var(--bg);
        color: var(--text); font-family: 'Courier New', 'MS Gothic', monospace;
      }
      .floor { position: fixed; left: -50%; right: -50%; bottom: -10%; height: 55%; z-index: 0; pointer-events: none;
        background-image: linear-gradient(var(--p) 1px, transparent 1px), linear-gradient(90deg, var(--p) 1px, transparent 1px); background-size: 60px 60px;
        transform: perspective(300px) rotateX(62deg); transform-origin: 50% 0; opacity: 0.35; animation: run 2.4s linear infinite;
        mask-image: linear-gradient(transparent, #000 40%); -webkit-mask-image: linear-gradient(transparent, #000 40%); }
      @keyframes run { to { background-position: 0 60px, 0 0; } }
      html.shader-bg .floor { display: none; }
      .scan { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px); }
      /* old error box. same era as the start menu */
      .win { position: relative; z-index: 2; width: min(520px, 100%); padding: 3px; background: color-mix(in srgb, var(--p) 6%, #1b1820);
        box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.22), inset -1px -1px 0 #050407, inset 2px 2px 0 rgba(255, 255, 255, 0.06), inset -2px -2px 0 rgba(0, 0, 0, 0.5), 6px 8px 0 rgba(0, 0, 0, 0.55);
        animation: pop 0.22s steps(5) both; }
      @keyframes pop { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
      .bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 4px 8px; font: 13px 'DotGothic16', monospace; letter-spacing: 1px;
        background: linear-gradient(90deg, color-mix(in srgb, var(--p) 62%, #1b1430), color-mix(in srgb, var(--s) 45%, #2a2438) 85%); }
      .bar b { font-weight: normal; color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5); }
      .bar span { display: grid; place-items: center; width: 20px; height: 18px; font-size: 12px; color: #e9e5ee; background: #1b1820;
        box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.22), inset -1px -1px 0 #050407; }
      .body { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; padding: 20px 18px 16px; font-family: 'DotGothic16', monospace; }
      canvas { width: 96px; height: 96px; image-rendering: pixelated; margin-top: 6px; }
      h1 { position: relative; margin: 0 0 4px; font: 52px/1 'DotGothic16', monospace; letter-spacing: 4px; color: #fff; text-shadow: -2px 0 rgba(255, 0, 64, 0.7), 2px 0 rgba(0, 229, 255, 0.7); }
      h1.jit { animation: jit 0.18s steps(2) 3; }
      @keyframes jit { 50% { transform: translate(3px, -1px) skewX(-8deg); text-shadow: -5px 0 rgba(255, 0, 64, 0.9), 5px 0 rgba(0, 229, 255, 0.9); } }
      h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: 1px; color: var(--s); font-weight: normal; }
      p { margin: 0 0 14px; font-size: 13px; line-height: 1.6; }
      code { display: block; padding: 5px 8px; margin: 0 0 12px; font-size: 12px; background: #0d0c11; word-break: break-all; color: #cfc8d8;
        box-shadow: inset 1px 1px 0 #050407, inset -1px -1px 0 rgba(255, 255, 255, 0.14); }
      .btns { display: flex; justify-content: flex-end; gap: 6px; }
      a.back { display: inline-block; padding: 6px 14px; font-size: 13px; color: #e9e5ee; background: #1b1820; text-decoration: none;
        box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.22), inset -1px -1px 0 #050407, inset 2px 2px 0 rgba(255, 255, 255, 0.06), inset -2px -2px 0 rgba(0, 0, 0, 0.5), 0 0 0 1px #050407; outline: 1px dotted transparent; outline-offset: -5px; }
      a.back:hover, a.back:focus-visible { background: color-mix(in srgb, var(--p) 62%, #1b1430); color: #fff; outline-color: rgba(255, 255, 255, 0.6); }
      a.back:active { box-shadow: inset 1px 1px 0 #050407, inset -1px -1px 0 rgba(255, 255, 255, 0.22), 0 0 0 1px #050407; }
      @media (max-width: 480px) { .body { grid-template-columns: 1fr; justify-items: center; text-align: center; } h1 { font-size: 52px; } }
      @media (prefers-reduced-motion: reduce) { .floor, h1.jit, .win { animation: none; } }
    </style>
  </head>
  <body>
    <div class="floor"></div>
    <div class="win" role="alertdialog" aria-labelledby="t">
      <div class="bar"><b>// error.exe 【エラー】</b><span aria-hidden="true">✕</span></div>
      <div class="body">
        <canvas id="mon" width="64" height="64" aria-hidden="true"></canvas>
        <div>
          <h1 id="t">404</h1>
          <h2>ページが見つかりません // FILE NOT FOUND</h2>
          <code id="path">C:\VAMPII\</code>
          <p>that page doesn't exist (or more likely I broke something lmao).</p>
          <div class="btns"><a class="back" href="/">[ 戻る // BACK TO VAMPII.OS ]</a></div>
        </div>
      </div>
    </div>
    <div class="scan"></div>
    <script>
      window.os = { prefs: {} };
      try { os.prefs = JSON.parse(localStorage.getItem('vmp_prefs') || '{}'); } catch (e) {}
      try { let m = localStorage.getItem('vmp_reduce_motion'); if (m === '1' || (m !== '0' && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.classList.add('reduce-motion'); } catch (e) {}
    </script>
    <script src="/sfx.js"></script>
    <script src="/apps_db.js"></script>
    <script>
      (function () {
        const T = { pink: ['#ff0099', '#ff66b3', 'rgba(255, 0, 153, 0.55)', '#ffe6f2', '#12000a'], blue: ['#00f0ff', '#ff007f', 'rgba(0, 240, 255, 0.45)', '#d1f8ff', '#020608'],
          purple: ['#bd00ff', '#00f0ff', 'rgba(189, 0, 255, 0.45)', '#f2d1ff', '#060208'], red: ['#ff003c', '#ffea00', 'rgba(255, 0, 60, 0.45)', '#ffd1dc', '#080202'],
          yellow: ['#fff200', '#ff2bd6', 'rgba(255, 242, 0, 0.45)', '#fffbd6', '#080700'] };
        let t = 'pink'; try { t = localStorage.getItem('vmp_theme') || 'pink'; } catch (e) {}
        if (t === 'custom') {
          // copy of the custom colour thing in os_core. TODO dont have it twice
          const ok = h => /^#[0-9a-f]{6}$/i.test(h || ''), cu = os.prefs.custom || {};
          const hx = h => { let n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
          const to = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
          const mix = (c, d, k) => c.map((v, i) => v * k + d[i] * (1 - k));
          const lum = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
          const lift = c => { for (let n = 0; lum(c) < 0.18 && n < 12; n++) c = mix(c, [255, 255, 255], 0.88); return c; };
          let p = lift(hx(ok(cu.a) ? cu.a : '#ff0099')), s = lift(hx(ok(cu.b) ? cu.b : '#00f0ff'));
          T.custom = [to(p), to(s), 'rgba(' + p.map(Math.round).join(', ') + ', 0.45)', to(mix(p, [255, 255, 255], 0.12)), to(mix(p, [5, 3, 7], 0.06))];
        }
        let c = T[t] || T.pink, r = document.documentElement.style;
        ['--p', '--s', '--glow', '--text', '--bg'].forEach((k, i) => r.setProperty(k, c[i]));
        // same live wallpaper as the desktop behind the error box, if the browser can do it
        ['--neon-primary', '--neon-secondary', '--neon-glow', '--text-main', '--bg-base'].forEach((k, i) => r.setProperty(k, c[i]));
        const hx = h => { let n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
        let a = hx(c[0]), b = hx(c[4]);
        r.setProperty('--bg-gradient-center', 'rgb(' + b.map((v, i) => Math.round(v * 0.86 + a[i] * 0.14)).join(',') + ')');
        document.getElementById('path').textContent = 'C:\\VAMPII' + decodeURIComponent(location.pathname).replace(/\//g, '\\');
        let I = (typeof appsDB !== 'undefined' && appsDB.icons) || null, art = I && I.art && I.art['💻'];
        let cv = document.getElementById('mon'), x = cv.getContext('2d');
        const dim = (h, k) => { let n = parseInt(h.slice(1), 16); return 'rgb(' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v * k)).join(',') + ')'; };
        let pal = Object.assign({}, I ? I.pal : {}, { p: c[0], P: dim(c[0], 0.68), Q: dim(c[0], 0.42), s: c[1], S: dim(c[1], 0.68), T: dim(c[1], 0.42) });
        let still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        function draw(n) {
          x.clearRect(0, 0, 64, 64); if (!art) return;
          let rows = art.split('|'), N = rows.length, sc = Math.floor(64 / N), off = (64 - N * sc) / 2;
          rows.forEach((row, y) => {
            let shift = n % 7 === 0 && y % 5 === 2 ? 2 : 0;
            for (let i = 0; i < N; i++) {
              let ch = row[i], col = pal[ch]; if (!col) continue;
              if ((ch === 'p' || ch === 'P' || ch === 'Q') && Math.random() < 0.35) col = Math.random() < 0.5 ? '#ffffff' : '#000000';
              x.fillStyle = col; x.fillRect(off + (i + shift) * sc, off + y * sc, sc, sc);
            }
          });
        }
        let n = 0; draw(0);
        if (!still) {
          setInterval(() => draw(++n), 110);
          let h = document.getElementById('t');
          setInterval(() => { h.classList.remove('jit'); void h.offsetWidth; h.classList.add('jit'); }, 2600);
        }
      })();
    </script>
    <script>
      // browsers wont play sound till you touch the page, so it waits for that if it has to
      (function () {
        let done = false;
        const oops = () => { if (done || !os.sfx) return; done = true; os.sfx('oops'); };
        try { let c = window.audioCtx || (window.audioCtx = new (window.AudioContext || window.webkitAudioContext)()); if (c.state === 'running') setTimeout(oops, 250); } catch (e) {}
        ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, e => { if (e.target.closest && e.target.closest('a.back')) { done = true; return; } oops(); }, { once: true }));
        let back = document.querySelector('a.back');
        if (back) back.addEventListener('click', e => { if (!os.sfx || !done) return; e.preventDefault(); os.sfx('back'); setTimeout(() => { location.href = back.href; }, 140); });
      })();
    </script>
    <script src="/moon.js"></script>
    <script src="/desktop_fx.js"></script>
  </body>
</html>
